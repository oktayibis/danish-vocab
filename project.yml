name: DanishVocab
options:
  bundleIdPrefix: com.oktay
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: 3SN795A9D6
targets:
  DanishVocab:
    type: application
    platform: iOS
    sources:
      - path: DanishVocab
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oktay.DanishVocab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Danish Vocab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  DanishVocabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DanishVocabTests
        type: syncedFolder
    dependencies:
      - target: DanishVocab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oktay.DanishVocabTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DanishVocab.app/DanishVocab"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  DanishVocab:
    build:
      targets:
        DanishVocab: all
        DanishVocabTests: [test]
    test:
      targets:
        - DanishVocabTests
